services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: admissions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d admissions"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend/SchoolAdmission.Api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${DATABASE_URL:-Host=db;Database=admissions;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}}
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
